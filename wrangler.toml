name = "referrals-live"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[vars]
APP_ORIGIN = "https://referrals.live"
SESSION_DAYS = "30"

[[d1_databases]]
binding = "DB"
database_name = "referrals-live"
database_id = "8c825251-cdbf-4087-82a6-eebff2bbb176"

# Live chat: the ChatRoom Durable Object lives in the referrals-live-ingest
# Worker. Binding it here lets the same-origin Pages Function at
# /api/chat/ws hand the WebSocket to the room, so the first-party session
# cookie reaches it and Premium members can post.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"
script_name = "referrals-live-ingest"
